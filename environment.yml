name: sandygs

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.9.23
  - pip=25.1.1
  - setuptools=80.9.0
  - wheel=0.45.1
  - ninja=1.12.1

  # The CUDA runtime bundled with PyTorch. Native extensions are compiled
  # against a compatible system CUDA toolkit (see README.md).
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=11.8

  # Shared by PGSR reconstruction, SandyGS integration, and visualization.
  - numpy=2.0.2
  - scipy=1.13.1
  - matplotlib=3.9.4
  - pillow=11.3.0
  - imageio=2.37.0
  - scikit-image=0.24.0
  - scikit-learn=1.6.1
  - pyyaml=6.0.2
  - tqdm=4.67.1


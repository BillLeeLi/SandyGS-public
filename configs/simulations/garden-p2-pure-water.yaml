schema_version: 1
scene_id: mipnerf360-garden
profile_id: p2-pure-water-smoke

# Match P0's SimRain initialization: 1.3 is an absolute water-surface level,
# not a uniform water thickness. Garden remains in uncalibrated simulation units.
initial_surface_level: 1.3

solver:
  water_dt: 0.001
  steps: 2
  frame_stride: 1
  target_cfl: 0.45
  snapshot_level: render

render:
  frame_time_seconds: 0.001
  fps: 30.0
  free_water_epsilon: 1.0e-6
  # P2 uses the supported pure-water rendering path.
  water_rendering_backend: sandygs_p4

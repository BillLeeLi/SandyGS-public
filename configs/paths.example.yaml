schema_version: 1

# Copy this file to configs/paths.local.yaml and either set the environment
# variables or replace each value with an absolute path on the current machine.
# The local file is ignored by Git.
roots:
  datasets: "${SANDYGS_DATA_ROOT}/datasets"
  checkpoints: "${SANDYGS_DATA_ROOT}/checkpoints"
  derived: "${SANDYGS_DATA_ROOT}/derived"
  artifacts: "${SANDYGS_ARTIFACT_ROOT}"

# Optional executable override. When omitted, SandyGS uses the explicit
# in-tree release build under solvers/sand_water/build/.../release/demo.
# The binary must have a matching sandygs-build.json generated by
# scripts/build_sand_water_solver.py.
# executables:
#   sand_water_solver: /absolute/path/to/demo
